<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    <link rel="stylesheet" href="cadastro.css">

    <title>Blink!</title>
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="header">
        <a href="#" class="header-logo">
            <img src="Logoblinkblack.PNG" alt="Blink!">
        </a>
    </header>


    <!-- CONTEÚDO -->
    <main class="main">

        <section class="Container">

            <form>

                <h1>Create Account</h1>


                <!-- NOME -->
                <div class="input-box">
                    <input
                        id="name"
                        type="text"
                        placeholder="Name"
                        required
                    >

                    <i class='bx bx-user'></i>
                </div>


                <!-- EMAIL -->
                <div class="input-box">
                    <input
                        id="email"
                        type="email"
                        placeholder="Email"
                        required
                    >

                    <i class='bx bx-envelope'></i>
                </div>


                <!-- SENHA -->
                <div class="input-box">
                    <input
                        id="password"
                        type="password"
                        placeholder="Password"
                        required
                    >

                    <i class='bx bxs-lock-alt'></i>
                </div>


                <!-- CONFIRMAR SENHA -->
                <div class="input-box">
                    <input
                        id="confirm-password"
                        type="password"
                        placeholder="Confirm Password"
                        required
                    >

                    <i class='bx bxs-lock-alt'></i>
                </div>


                <!-- TERMOS -->
                <div class="terms">

                    <label>

                        <input
                            type="checkbox"
                            id="terms"
                        >

                        <span>
                            I agree to the
                            <a href="#">Terms of Service</a>
                            and
                            <a href="#">Privacy Policy</a>.
                        </span>

                    </label>

                </div>


                <!-- BOTÃO -->
                <button type="submit">
                    Create Account
                </button>

            </form>


            <!-- LOGIN -->
            <div class="register">
                <p>
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>
            </div>

        </section>

    </main>


    <!-- RODAPÉ -->
    <footer class="footer">

        <span>© 2026 Blink!</span>

        <nav>
            <a href="#">Terms</a>
            <a href="#">Privacy</a>
        </nav>

    </footer>


    <!-- JAVASCRIPT -->
    <script src="cadastro.js"></script>

</body>

</html>
