<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    <link rel="stylesheet" href="style.css">

    <title>Blink! - Login</title>
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="header">
        <a href="#" class="header-logo">
            <img src="logo.png" alt="Blink!">
        </a>
    </header>


    <!-- CONTEÚDO -->
    <main class="main">

        <section class="Container">

            <form>

                <h1>Login</h1>

                <!-- EMAIL -->
                <div class="input-box">
                    <input
                        id="email"
                        type="email"
                        placeholder="Email"
                        required
                    >

                    <i class='bx bx-envelope'></i>
                </div>


                <!-- SENHA -->
                <div class="input-box">
                    <input
                        id="password"
                        type="password"
                        placeholder="Password"
                        required
                    >

                    <i class='bx bxs-lock-alt'></i>
                </div>


                <!-- LEMBRAR / ESQUECI -->
                <div class="remember-forgot">

                    <label>
                        <input type="checkbox">
                        Remember-me
                    </label>

                    <a href="#">Forgot Password?</a>

                </div>


                <!-- BOTÃO -->
                <button type="submit">
                    Login
                </button>

            </form>


            <!-- CADASTRO -->
            <div class="register">
                <p>
                    Don't have an account?
                    <a href="cadastro.html">Register</a>
                </p>
            </div>

        </section>

    </main>


    <!-- RODAPÉ -->
    <footer class="footer">

        <span>© 2026 Blink!</span>

        <nav>
            <a href="#">Terms</a>
            <a href="#">Privacy</a>
        </nav>

    </footer>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
